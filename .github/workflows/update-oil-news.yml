name: Refresh oil and gas news

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
      - name: Fetch official oil and gas news
        run: node .github/scripts/update-oil-news.mjs
      - name: Save refreshed news
        run: |
          if git diff --quiet -- data/oil-news.json; then
            echo "No news changes"
          else
            git config user.name "YAS News Bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/oil-news.json
            git commit -m "Refresh oil and gas news"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
